<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Character & Word Counter</title>
  </head>
  <body>
    <main>
      <div class="box">
        <input class="text-area" type="text" maxlength="100"/>
        <p>Characters: <span id="char-count">0</span></p>
        <p>Words: <span id="word-count">0</span></p>
        <p>Remaining: <span id="remaining-count">100</span></p>
        <button class="clear-btn">Clear</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
